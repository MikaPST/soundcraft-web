name: Build and publish SoundCraft Web

on:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "README.md"
      - "docker-compose.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-soundcraft-web
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Check out upstream SoundCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/soundcraft
          ref: main
          path: upstream

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build SoundCraft Web
        working-directory: upstream/apps/soundcraft-web
        run: |
          trunk build --release
          test -s ../../dist/web/index.html
          test -n "$(find ../../dist/web -maxdepth 1 -type f -name 'soundcraft-web-*.js' -print -quit)"
          test -n "$(find ../../dist/web -maxdepth 1 -type f -name 'soundcraft-web-*_bg.wasm' -print -quit)"

      - name: Prepare NGINX build context
        run: |
          mkdir -p build-context/site
          cp -a upstream/dist/web/. build-context/site/

          cat > build-context/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY site/ /usr/share/nginx/html/
          EXPOSE 8080
          EOF

          cat > build-context/nginx.conf <<'EOF'
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              include /etc/nginx/mime.types;
              types {
                  application/wasm wasm;
                  text/javascript js;
                  text/html html;
              }

              add_header X-Content-Type-Options nosniff;

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types
                  application/wasm
                  text/javascript
                  text/html;

              location = /index.html {
                  add_header Cache-Control "no-cache";
              }

              location ~* ^/soundcraft-web-[0-9a-f]+(_bg)?\.(js|wasm)$ {
                  add_header Cache-Control "public, max-age=31536000, immutable";
                  try_files $uri =404;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract upstream commit
        id: upstream
        run: echo "sha=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: build-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/soundcraft-web:latest
            ghcr.io/${{ github.repository_owner }}/soundcraft-web:upstream-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.title=SoundCraft Web
            org.opencontainers.image.description=Self-hosted WebAssembly build of SoundCraft
            org.opencontainers.image.source=https://github.com/storytold/soundcraft
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
