name: Build and publish SoundCraft Web
on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild existing release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 3 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/publish-image.yml", "Dockerfile", "nginx.conf", ".dockerignore", "docker-compose.yml"]
permissions:
  contents: write
  packages: write
concurrency:
  group: soundcraft-web-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout packaging
        uses: actions/checkout@v4
        with:
          path: packaging
      - name: Resolve official release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = {owner: 'storytold', repo: 'soundcraft'};
            const {data: release} = requested
              ? await github.rest.repos.getReleaseByTag({...args, tag: requested})
              : await github.rest.repos.getLatestRelease(args);
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', release.html_url);
            core.setOutput('name', release.name || `SoundCraft ${release.tag_name}`);
            core.setOutput('prerelease', String(release.prerelease));
      - name: Check existing release
        id: check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try { await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.TAG}); exists = true; }
            catch(e) { if(e.status !== 404) throw e; }
            core.setOutput('skip', String(exists && process.env.FORCE !== 'true' && context.eventName !== 'push'));
      - name: Checkout SoundCraft
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/soundcraft
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
      - name: Record commit
        if: steps.check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Rust and WASM target
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown
      - name: Cache Rust
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"
      - name: Install Trunk
        if: steps.check.outputs.skip != 'true'
        run: cargo install trunk --locked
      - name: Compile SoundCraft
        if: steps.check.outputs.skip != 'true'
        working-directory: upstream/apps/soundcraft-web
        shell: bash
        run: |
          set -euo pipefail
          trunk build --release
          test -s ../../dist/web/index.html
          test -n "$(find ../../dist/web -maxdepth 1 -name '*.wasm' -print -quit)"
      - name: Prepare Docker context
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context/site
          cp -a upstream/dist/web/. docker-context/site/
          cp packaging/Dockerfile packaging/nginx.conf packaging/.dockerignore docker-context/
          for f in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do
            if test -f "upstream/$f"; then cp "upstream/$f" docker-context/site/; fi
          done
      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mikapst/soundcraft-web:latest
            ghcr.io/mikapst/soundcraft-web:${{ steps.release.outputs.tag }}
            ghcr.io/mikapst/soundcraft-web:upstream-${{ steps.source.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          NAME: ${{ steps.release.outputs.name }}
          URL: ${{ steps.release.outputs.url }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SHA: ${{ steps.source.outputs.sha }}
          SHORT: ${{ steps.source.outputs.short }}
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.TAG;
            const {data: upstream} = await github.rest.repos.getReleaseByTag({owner:'storytold',repo:'soundcraft',tag});
            const image = 'ghcr.io/mikapst/soundcraft-web';
            const body = [
              `Community-maintained Docker packaging for **${process.env.NAME}**.`,
              '', '## Docker images',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.SHORT}\``,
              '', 'Platforms: linux/amd64, linux/arm64',
              `Upstream: ${process.env.URL}`,
              `Commit: ${process.env.SHA}`,
              `Digest: ${process.env.DIGEST}`,
              '', '## Upstream release notes',
              upstream.body || 'No upstream release notes.'
            ].join('\n');
            let existing;
            try { existing = (await github.rest.repos.getReleaseByTag({...context.repo,tag})).data; }
            catch(e) { if(e.status !== 404) throw e; }
            const args = {...context.repo, name:`SoundCraft Web ${tag}`, body,
              draft:false, prerelease:process.env.PRERELEASE === 'true'};
            if(existing) await github.rest.repos.updateRelease({...args,release_id:existing.id});
            else await github.rest.repos.createRelease({...args,tag_name:tag,target_commitish:context.sha});
