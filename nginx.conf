server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/javascript text/javascript text/css text/html;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(wasm|js)$ {
        types { application/wasm wasm; text/javascript js; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
